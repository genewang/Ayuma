version: '3.8'

services:
  # Backend service
  backend:
    build:
      context: .
      dockerfile: Dockerfile.simple
    ports:
      - "8000:8000"
    volumes:
      - chroma_data:/data/chroma
      - ./backend:/app/backend
      - .env:/app/.env
    environment:
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
    networks:
      - ayuma-network

  # Frontend service (optional, can be run separately)
  # frontend:
  #   build:
  #     context: .
  #     dockerfile: frontend/Dockerfile
  #   ports:
  #     - "80:80"
  #   depends_on:
  #     - backend
  #   restart: unless-stopped
  #   networks:
  #     - ayuma-network

networks:
  ayuma-network:
    driver: bridge

volumes:
  chroma_data:
    driver: local
